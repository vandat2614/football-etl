name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -v

      - name: Check secrets
        run: |
          echo "host length: ${#VM_HOST}"
          echo "user length: ${#VM_USER}"

  deploy:
  
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
    steps:

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          VM_HOST="$(printf '%s' "$VM_HOST" | tr -d '[:space:]')"
          VM_USER="$(printf '%s' "$VM_USER" | tr -d '[:space:]')"
          ssh "$VM_USER@$VM_HOST" 'cd ~/projects/football-etl && git pull --ff-only && docker compose up -d --build && docker compose ps'
